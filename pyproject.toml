[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-qqbot"
dynamic = ["version"]
description = "Alliance Auth plugin: QQ binding and QQ group membership gate"
readme = "README.md"
authors = [{ name = "yilifaer" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "allianceauth>=5.2,<6",
]

[project.urls]
Homepage = "https://github.com/yilifaer/aa-qqbot-plugin"
Repository = "https://github.com/yilifaer/aa-qqbot-plugin"

[tool.setuptools.dynamic]
version = { attr = "qqbot.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["qqbot*"]
exclude = ["qqbot.tests*"]

[tool.setuptools.package-data]
qqbot = [
    "templates/qqbot/*.html",
    "templates/qqbot/**/*.html",
]
