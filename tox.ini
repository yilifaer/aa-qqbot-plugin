# Supported: Alliance Auth 5.2 - 5.5. Test matrix: python 3.10-3.13 x
# AA 5.2.* / 5.5.* (oldest and newest), AA 5.3.* and 5.4.* on the default
# python, plus the latest 5.x as an early warning for releases after 5.5.
#
#   tox                       # the whole matrix (SQLite)
#   tox -e py312-aa55         # one combination
#   tox -e py-aa54            # AA 5.4.* on the default python
#   tox -e py312-aa55 -- qqbot.tests.test_checks   # selected test modules
#   tox -e py-aa5             # whatever the latest AA 5.x is
#   tox -e py-aa55-mysql      # MariaDB/MySQL, see QQBOT_DB_* in testauth/settings.py
#   tox -e py-aa52-postgres   # PostgreSQL
#
# Needs a local Redis (QQBOT_TEST_REDIS, default redis://127.0.0.1:6379/15)
# and the MySQL client headers (mysqlclient is an Alliance Auth dependency),
# e.g. `apt install default-libmysqlclient-dev build-essential pkg-config`.

[tox]
requires = tox>=4
envlist =
    py{310,311,312,313}-aa{52,55}
    py-aa{53,54,5}
    py-aa{52,55}-{mysql,postgres}

[testenv]
# Tests run from the source tree (manage.py + testauth/); the package's
# own dependency is installed explicitly below.
skip_install = true
deps =
    aa52: allianceauth==5.2.*
    aa53: allianceauth==5.3.*
    aa54: allianceauth==5.4.*
    aa55: allianceauth==5.5.*
    # AA 5.2.x/5.3.x do not pin django-sri; 1.0 removed the sri_static tag
    # AA's templates use (AA 5.4.0+ pins django-sri<1 itself).
    aa52,aa53: django-sri<1
    # AA 5.2-5.4 import httpx, which django-esi 9.x brought in; django-esi
    # 10 (2026-10, required by AA 5.5) switched to httpx2.
    aa52,aa53,aa54: django-esi<10
    aa5: allianceauth>=5.2,<6
    postgres: psycopg[binary]
    pyflakes
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings
    PYTHONDONTWRITEBYTECODE = 1
    mysql: QQBOT_TEST_DB = mysql
    postgres: QQBOT_TEST_DB = postgres
passenv =
    QQBOT_TEST_REDIS
    QQBOT_DB_*
commands =
    python manage.py makemigrations qqbot --check --dry-run
    python manage.py test --noinput {posargs:qqbot}
    python -m pyflakes qqbot
