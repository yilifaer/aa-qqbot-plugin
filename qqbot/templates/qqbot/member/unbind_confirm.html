{% extends "qqbot/base.html" %}

{% block qqbot_title %}解除 QQ 绑定{% endblock qqbot_title %}

{% block qqbot_body %}
    <div class="card border-danger mb-3">
        <div class="card-header text-bg-danger">确认解除绑定</div>
        <div class="card-body">
            <p class="fs-5">你确定要解除 QQ <strong>{{ status.masked_qq }}</strong> 的绑定吗？</p>
            <ul>
                <li>解除后，这个 QQ 就不再算作联盟成员，机器人可能不再批准它入群，也可能把它移出受管的 QQ 群。</li>
                <li>以后想用时，可以随时重新绑定。</li>
            </ul>
            <form method="post" action="{% url 'qqbot:member_unbind' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="fa-solid fa-link-slash fa-fw"></i> 确认解除绑定
                </button>
            </form>
            <a class="btn btn-secondary ms-2" href="{% url 'qqbot:my_qq' %}">返回，不解除</a>
        </div>
    </div>
{% endblock qqbot_body %}
