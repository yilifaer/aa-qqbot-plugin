{% comment %}
The group rules (Config.rules_text) as small muted text at the bottom of the
services card. External text: escaped, newlines become <br>.

入群须知（Config.rules_text），以灰色小字显示在服务页卡片的底部。
内容来自外部（管理员填写）：会先转义，换行变成 <br>。
{% endcomment %}
{% if rules_text %}
    <hr>
    <div class="small text-body-secondary" id="qqbot-rules">
        <div class="fw-bold mb-1">入群须知</div>
        {{ rules_text|linebreaksbr }}
    </div>
{% endif %}
