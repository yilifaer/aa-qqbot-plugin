{% comment %}
Binding status badge. Context: b (Binding), conflict (bool), shadowed (bool).

绑定状态徽章。上下文：b（Binding）、conflict（bool）、shadowed（bool）。
{% endcomment %}
{% if b.status == 'verified' %}
    <span class="badge text-bg-success">已验证</span>
{% else %}
    <span class="badge text-bg-info">老成员免验证</span>
{% endif %}
{% if conflict %}<span class="badge text-bg-danger">冲突</span>{% endif %}
{% if shadowed %}<span class="badge text-bg-warning">此 QQ 已被别人验证</span>{% endif %}
